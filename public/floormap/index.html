<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueFlow - Floor Plan</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>

  <header class="topbar">
    <span class="brand"><span class="brand-mark">✳</span> Venueflow</span>
  </header>

  <main class="page">
    <div class="page-header">
      <h1>Venue floor plan</h1>
    </div>

    <div class="floormap-layout">
      <aside class="panel sidebar">
        <h2 class="panel-title">Shapes</h2>
        <div class="palette-grid">
          <div class="palette-card" draggable="true" data-type="polygon">
            <div class="card-preview">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="20" height="20" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
              </svg>
            </div>
            <span class="card-name">Polygon</span>
          </div>
          <div class="palette-card" draggable="true" data-type="circle">
            <div class="card-preview">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="11" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
              </svg>
            </div>
            <span class="card-name">Circle</span>
          </div>
        </div>
      </aside>

      <section class="panel canvas-panel">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button type="button" id="btn-undo" class="toolbar-btn" title="Undo (Ctrl+Z)" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7v6h6"/>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
              </svg>
              <span>Undo</span>
            </button>
            <button type="button" id="btn-redo" class="toolbar-btn" title="Redo (Ctrl+Y)" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 7v6h-6"/>
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
              </svg>
              <span>Redo</span>
            </button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button type="button" id="btn-reset" class="toolbar-btn toolbar-btn-danger" title="Reset canvas" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              <span>Reset</span>
            </button>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="c" width="800" height="600"></canvas>
        </div>
      </section>

      <aside class="panel properties-panel">
        <h2 class="panel-title">Object properties</h2>
        <div id="no-selection" class="empty-state">
          <p>Select a shape on the canvas to view and edit its properties.</p>
        </div>
        <div id="selection-properties" class="properties-content" style="display: none;">
          <div class="property-group">
            <label class="property-label">Object name</label>
            <div class="name-display">
              <span id="prop-preview" class="name-preview"></span>
              <input id="prop-name" type="text" class="name-input" placeholder="Object name" autocomplete="off">
            </div>
          </div>

          <div class="property-group">
            <label class="property-label">Dimensions</label>
            <div class="dimensions-grid">
              <div class="dimension-field">
                <span class="field-label">Width</span>
                <div class="input-with-unit">
                  <input id="prop-width" type="number" min="20" max="800" class="dimension-input">
                </div>
              </div>
              <div class="dimension-field">
                <span class="field-label">Length</span>
                <div class="input-with-unit">
                  <input id="prop-length" type="number" min="20" max="600" class="dimension-input">
                </div>
              </div>
            </div>
            <div id="prop-ratio-group" class="ratio-lock-row" style="display: none;">
              <label class="ratio-lock-label">
                <input id="prop-ratio-lock" type="checkbox">
                <span>Lock ratio</span>
              </label>
            </div>
          </div>

          <div id="prop-sides-group" class="property-group" style="display: none;">
            <label class="property-label">Sides</label>
            <div class="input-with-unit">
              <input id="prop-sides" type="number" min="3" max="20" value="4" class="dimension-input">
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div id="context-menu" class="context-menu" style="display: none;">
    <button type="button" class="context-menu-item" id="ctx-undo">
      <span class="context-menu-text">Undo</span>
      <span class="context-menu-shortcut">Ctrl+Z</span>
    </button>
    <button type="button" class="context-menu-item" id="ctx-redo">
      <span class="context-menu-text">Redo</span>
      <span class="context-menu-shortcut">Ctrl+Y</span>
    </button>
    <div class="context-menu-separator"></div>
    <button type="button" class="context-menu-item" id="ctx-copy">
      <span class="context-menu-text">Copy</span>
      <span class="context-menu-shortcut">Ctrl+C</span>
    </button>
    <button type="button" class="context-menu-item" id="ctx-paste">
      <span class="context-menu-text">Paste</span>
      <span class="context-menu-shortcut">Ctrl+V</span>
    </button>
    <div class="context-menu-separator"></div>
    <button type="button" class="context-menu-item context-menu-item-danger" id="ctx-delete">
      <span class="context-menu-text">Delete</span>
      <span class="context-menu-shortcut">Del</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>

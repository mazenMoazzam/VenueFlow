<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueFlow - Floor Plan</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>

  <header class="topbar">
    <span class="brand"><span class="brand-mark">✳</span> Venueflow</span>
  </header>

  <main class="page">
    <div class="page-header">
      <h1>Venue floor plan</h1>
    </div>

    <div class="floormap-layout">
      <aside class="panel sidebar">
        <h2 class="panel-title">Shapes</h2>
        <div class="palette-grid">
          <div class="palette-card" draggable="true" data-type="polygon">
            <div class="card-preview">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="20" height="20" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
              </svg>
            </div>
            <span class="card-name">Polygon</span>
          </div>
          <div class="palette-card" draggable="true" data-type="circle">
            <div class="card-preview">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="11" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
              </svg>
            </div>
            <span class="card-name">Circle</span>
          </div>
        </div>
      </aside>

      <section class="panel canvas-panel">
        <div class="canvas-wrapper">
          <canvas id="c" width="800" height="600"></canvas>
        </div>
      </section>

      <aside class="panel properties-panel">
        <h2 class="panel-title">Object properties</h2>
        <div id="no-selection" class="empty-state">
          <p>Select a shape on the canvas to view and edit its properties.</p>
        </div>
        <div id="selection-properties" class="properties-content" style="display: none;">
          <div class="property-group">
            <label class="property-label">Object name</label>
            <div class="name-display">
              <span id="prop-preview" class="name-preview"></span>
              <input id="prop-name" type="text" class="name-input" placeholder="Object name" autocomplete="off">
            </div>
          </div>

          <div class="property-group">
            <label class="property-label">Dimensions</label>
            <div class="dimensions-grid">
              <div class="dimension-field">
                <span class="field-label">Width</span>
                <div class="input-with-unit">
                  <input id="prop-width" type="number" min="20" max="800" class="dimension-input">
                </div>
              </div>
              <div class="dimension-field">
                <span class="field-label">Length</span>
                <div class="input-with-unit">
                  <input id="prop-length" type="number" min="20" max="600" class="dimension-input">
                </div>
              </div>
            </div>
            <div id="prop-ratio-group" class="ratio-lock-row" style="display: none;">
              <label class="ratio-lock-label">
                <input id="prop-ratio-lock" type="checkbox">
                <span>Lock ratio</span>
              </label>
            </div>
          </div>

          <div id="prop-sides-group" class="property-group" style="display: none;">
            <label class="property-label">Sides</label>
            <div class="input-with-unit">
              <input id="prop-sides" type="number" min="3" max="20" value="4" class="dimension-input">
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

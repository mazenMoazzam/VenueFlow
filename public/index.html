<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VenueFlow</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/create-event.css" />
    <link rel="stylesheet" href="/forms.css" />
    <link rel="stylesheet" href="/tasks.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><span class="brand-mark">✳</span> Venueflow</span>
    </header>

    <main class="page">
      <div class="page-header">
        <h1>Event planner</h1>
      </div>

      <div class="planner-layout">
        <aside class="panel" id="events-panel">
          <h2 class="panel-title">Events</h2>
          <p class="panel-empty">No events yet.</p>
          <button class="new-event-link" id="open-create-event" type="button">+ New event</button>
        </aside>

        <section class="panel" id="calendar-panel">
          
        </section>

        <aside class="panel" id="tasks-panel">
          <h2 class="panel-title">Tasks</h2>
        </aside>
      </div>
    </main>

    <dialog class="event-dialog" id="create-event-dialog" aria-labelledby="create-event-title">
      <div class="event-dialog-header">
        <h2 id="create-event-title">Create event</h2>
        <button class="dialog-close" type="button" aria-label="Close dialog">×</button>
      </div>
      <form id="create-event-form" class="panel event-form" novalidate>
        <ul id="form-errors" class="form-errors" role="alert" hidden></ul>
        <label class="form-field"><span>Name</span><input name="name" required maxlength="200" /></label>
        <label class="form-field"><span>Description <em>(optional)</em></span><textarea name="description" rows="3"></textarea></label>
        <div class="form-row">
          <label class="form-field"><span>Starts</span><input name="starts_at" type="datetime-local" required /></label>
          <label class="form-field"><span>Ends <em>(optional)</em></span><input name="ends_at" type="datetime-local" /></label>
        </div>
        <label class="form-field"><span>Location <em>(optional)</em></span><input name="location" /></label>
        <div class="form-row">
          <label class="form-field"><span>Expected attendees <em>(optional)</em></span><input name="expected_attendees" type="number" min="1" step="1" /></label>
          <label class="form-field"><span>Budget (USD) <em>(optional)</em></span><input name="budget" type="number" min="0" step="0.01" /></label>
        </div>
        <div class="form-actions">
          <button class="button button-secondary dialog-cancel" type="button">Cancel</button>
          <button type="submit" class="button button-primary">Create event</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
    <script type="module" src="/create-event.js"></script>
  </body>
</html>
